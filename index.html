<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sets">
<meta name="theme-color" content="#111827">
<title>Set Counter</title>
<style>
  :root {
    --bg: #f3f4f6; --card: #ffffff; --text: #111827; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --accent-text: #ffffff;
    --good: #16a34a; --bar: #e5e7eb; --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f17; --card: #161b26; --text: #f3f4f6; --muted: #9ca3af;
      --line: #273042; --accent: #3b82f6; --bar: #273042; --good: #22c55e; --danger: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(80px + env(safe-area-inset-bottom));
  }
  header { padding: 18px 16px 6px; padding-top: calc(18px + env(safe-area-inset-top)); }
  h1 { margin: 0; font-size: 26px; }
  .sub { color: var(--muted); font-size: 15px; }
  main { padding: 8px 16px; max-width: 560px; margin: 0 auto; }
  section { display: none; }
  section.active { display: block; }
  .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  h2 { font-size: 18px; margin: 0 0 12px; }

  /* Progress */
  .muscle { margin-bottom: 16px; }
  .muscle:last-child { margin-bottom: 0; }
  .muscle-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .muscle-name { font-weight: 600; font-size: 18px; }
  .muscle-count { font-size: 18px; font-variant-numeric: tabular-nums; }
  .muscle-count.done { color: var(--good); font-weight: 700; }
  .bar { height: 12px; background: var(--bar); border-radius: 6px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 6px; }
  .bar > div.done { background: var(--good); }

  /* Forms */
  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  input, select {
    width: 100%; font-size: 18px; padding: 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  button {
    font-size: 18px; padding: 14px; border: 0; border-radius: 12px; cursor: pointer;
    background: var(--accent); color: var(--accent-text); font-weight: 600;
  }
  button.wide { width: 100%; margin-top: 14px; }
  button.plain { background: transparent; color: var(--accent); padding: 8px; font-weight: 500; }
  button.del { background: transparent; color: var(--danger); padding: 6px 10px; font-size: 15px; font-weight: 500; }

  .set-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .set-item:first-child { border-top: 0; }
  .set-item small { color: var(--muted); display: block; font-size: 14px; }
  .empty { color: var(--muted); }
  .flash { color: var(--good); font-size: 15px; min-height: 20px; margin-top: 8px; text-align: center; }

  /* Settings */
  .target-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
  .target-row input { width: 90px; text-align: center; }
  details { border-top: 1px solid var(--line); padding: 10px 0; }
  details:first-of-type { border-top: 0; }
  summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
  summary::-webkit-details-marker { display: none; }
  summary span { color: var(--muted); font-weight: 400; font-size: 14px; text-align: right; margin-left: 10px; }
  .pct-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .pct-grid input { text-align: center; }
  .hint { color: var(--muted); font-size: 14px; margin: 0 0 10px; }

  .rest-row { margin-top: 10px; }

  /* Bottom area: rest timer + tabs */
  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--card); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  body.resting { padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
  #timer {
    display: none; align-items: center; gap: 8px;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
  }
  body.resting #timer { display: flex; }
  #timer-text { flex: 1; font-size: 15px; color: var(--muted); }
  #timer-time { display: block; font-size: 30px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1.1; }
  #timer button { font-size: 16px; padding: 10px 12px; background: var(--bg); color: var(--text); border-radius: 10px; }
  #timer.over { background: var(--good); }
  #timer.over #timer-text, #timer.over #timer-time { color: #fff; }
  #timer.over .adjust { display: none; }
  nav { display: flex; }
  nav button {
    flex: 1; background: transparent; color: var(--muted); border-radius: 0;
    padding: 16px 0 18px; font-size: 16px;
  }
  nav button.active { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1 id="title">This week</h1>
  <div class="sub" id="week-label"></div>
</header>

<main>
  <!-- PROGRESS -->
  <section id="tab-progress" class="active">
    <div class="card" id="progress-list"></div>
  </section>

  <!-- LOG -->
  <section id="tab-log">
    <div class="card">
      <label for="log-exercise">Exercise</label>
      <select id="log-exercise"></select>
      <div class="two">
        <div>
          <label for="log-weight">Weight</label>
          <input id="log-weight" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
        </div>
        <div>
          <label for="log-reps">Reps</label>
          <input id="log-reps" type="number" inputmode="numeric" min="1" step="1" placeholder="0">
        </div>
      </div>
      <button class="wide" id="add-set">Add set</button>
      <div class="flash" id="flash"></div>
    </div>
    <div class="card">
      <h2>Today's sets</h2>
      <div id="today-list"></div>
    </div>
  </section>

  <!-- SETTINGS -->
  <section id="tab-settings">
    <div class="card">
      <h2>Weekly targets (sets)</h2>
      <div id="targets"></div>
    </div>
    <div class="card">
      <h2>Exercises</h2>
      <p class="hint">Tap an exercise to change how much each set counts for each muscle. 100 = a full set, 50 = half a set.</p>
      <div id="exercise-list"></div>
    </div>
    <div class="card">
      <h2>Add your own exercise</h2>
      <label for="new-name">Name</label>
      <input id="new-name" type="text" placeholder="e.g. Cable fly">
      <div class="pct-grid" id="new-pcts"></div>
      <div class="rest-row">
        <label for="new-rest">Rest between sets (seconds)</label>
        <input id="new-rest" type="number" inputmode="numeric" min="0" step="15" value="90">
      </div>
      <button class="wide" id="add-exercise">Add exercise</button>
    </div>
  </section>
</main>

<div class="bottom">
  <div id="timer">
    <div id="timer-text">Rest<span id="timer-time">0:00</span></div>
    <button class="adjust" id="timer-minus">−15</button>
    <button class="adjust" id="timer-plus">+15</button>
    <button id="timer-close">Skip</button>
  </div>
  <nav>
    <button data-tab="progress" class="active">Progress</button>
    <button data-tab="log">Log</button>
    <button data-tab="settings">Settings</button>
  </nav>
</div>

<script>
const MUSCLES = ["chest", "back", "biceps", "triceps", "shoulders", "legs"];
const NICE = { chest: "Chest", back: "Back", biceps: "Biceps", triceps: "Triceps", shoulders: "Shoulders", legs: "Legs" };
const STORAGE_KEY = "set-counter-v1";

// Starter exercises. Numbers are how much one set counts for each muscle (1 = full set, 0.5 = half).
// The last number is the rest time in seconds.
const STARTER_EXERCISES = [
  ["Bench press",            { chest: 1, triceps: 0.5 }, 180],
  ["Push-ups",               { chest: 1, triceps: 0.5 }, 90],
  ["Incline dumbbell press", { chest: 1, shoulders: 0.5, triceps: 0.5 }, 120],
  ["Dips",                   { chest: 0.5, triceps: 1 }, 120],
  ["Pull-ups",               { back: 1, biceps: 0.5 }, 120],
  ["Lat pulldown",           { back: 1, biceps: 0.5 }, 120],
  ["Barbell row",            { back: 1, biceps: 0.5 }, 120],
  ["Shoulder press",         { shoulders: 1, triceps: 0.5 }, 120],
  ["Lateral raise",          { shoulders: 1 }, 60],
  ["Bicep curl",             { biceps: 1 }, 60],
  ["Hammer curl",            { biceps: 1 }, 60],
  ["Tricep pushdown",        { triceps: 1 }, 60],
  ["Skull crushers",         { triceps: 1 }, 60],
  ["Squat",                  { legs: 1 }, 180],
  ["Leg press",              { legs: 1 }, 150],
  ["Lunges",                 { legs: 1 }, 90],
  ["Deadlift",               { legs: 1, back: 0.5 }, 180],
  ["Romanian deadlift",      { legs: 1, back: 0.25 }, 150],
];
const DEFAULT_REST = 90;

function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function defaultState() {
  const targets = {};
  MUSCLES.forEach(m => targets[m] = 10);
  return {
    targets,
    exercises: STARTER_EXERCISES.map(([name, split, rest]) => ({ id: newId(), name, split, rest })),
    sets: [],
    restEnd: null,
  };
}

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved && saved.exercises) {
      // Data saved before rest times existed: give each exercise its starter rest time, or the default.
      saved.exercises.forEach(e => {
        if (e.rest == null) {
          const starter = STARTER_EXERCISES.find(([name]) => name === e.name);
          e.rest = starter ? starter[2] : DEFAULT_REST;
        }
      });
      return saved;
    }
  } catch (e) {}
  return defaultState();
}

let state = load();

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

// ---- Dates: weeks start on Monday ----
function startOfWeek(d = new Date()) {
  const s = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const daysSinceMonday = (s.getDay() + 6) % 7;
  s.setDate(s.getDate() - daysSinceMonday);
  return s;
}
function isToday(iso) {
  const d = new Date(iso), n = new Date();
  return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
}
function fmt(n) { return Math.round(n * 100) / 100; }

function findExercise(id) { return state.exercises.find(e => e.id === id); }

// Current percentages are used, so editing an exercise also fixes this week's totals.
// If the exercise was deleted, fall back to the split saved with the set.
function splitFor(set) {
  const ex = findExercise(set.exId);
  return ex ? ex.split : (set.split || {});
}

// ---- Progress ----
function renderProgress() {
  const weekStart = startOfWeek();
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate() + 6);
  const opts = { day: "numeric", month: "short" };
  document.getElementById("week-label").textContent =
    weekStart.toLocaleDateString(undefined, opts) + " – " + weekEnd.toLocaleDateString(undefined, opts);

  const totals = {};
  MUSCLES.forEach(m => totals[m] = 0);
  state.sets
    .filter(s => new Date(s.date) >= weekStart)
    .forEach(s => {
      const split = splitFor(s);
      MUSCLES.forEach(m => totals[m] += split[m] || 0);
    });

  document.getElementById("progress-list").innerHTML = MUSCLES.map(m => {
    const target = state.targets[m] || 0;
    const done = target > 0 && totals[m] >= target;
    const pct = target > 0 ? Math.min(100, totals[m] / target * 100) : 0;
    return `<div class="muscle">
      <div class="muscle-row">
        <span class="muscle-name">${NICE[m]}</span>
        <span class="muscle-count ${done ? "done" : ""}">${fmt(totals[m])} / ${fmt(target)}${done ? " ✓" : ""}</span>
      </div>
      <div class="bar"><div class="${done ? "done" : ""}" style="width:${pct}%"></div></div>
    </div>`;
  }).join("");
}

// ---- Log ----
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderExerciseSelect() {
  const sel = document.getElementById("log-exercise");
  const current = sel.value;
  const sorted = [...state.exercises].sort((a, b) => a.name.localeCompare(b.name));
  sel.innerHTML = sorted.map(e => `<option value="${e.id}">${escapeHtml(e.name)}</option>`).join("");
  if (current && findExercise(current)) sel.value = current;
  prefillLast();
}

// Fill weight and reps with whatever was used last time for this exercise.
function prefillLast() {
  const exId = document.getElementById("log-exercise").value;
  const last = [...state.sets].reverse().find(s => s.exId === exId);
  document.getElementById("log-weight").value = last ? last.weight : "";
  document.getElementById("log-reps").value = last ? last.reps : "";
}

function renderToday() {
  const today = state.sets.filter(s => isToday(s.date));
  const box = document.getElementById("today-list");
  if (!today.length) { box.innerHTML = `<div class="empty">No sets yet today.</div>`; return; }
  box.innerHTML = today.slice().reverse().map(s => {
    const ex = findExercise(s.exId);
    const name = ex ? ex.name : s.exName;
    const time = new Date(s.date).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    return `<div class="set-item">
      <div>${escapeHtml(name)} — ${fmt(s.weight)} × ${s.reps}<small>${time}</small></div>
      <button class="del" data-del-set="${s.id}">Delete</button>
    </div>`;
  }).join("");
}

document.getElementById("log-exercise").addEventListener("change", prefillLast);

document.getElementById("add-set").addEventListener("click", () => {
  const exId = document.getElementById("log-exercise").value;
  const ex = findExercise(exId);
  const weight = parseFloat(document.getElementById("log-weight").value) || 0;
  const reps = parseInt(document.getElementById("log-reps").value, 10);
  const flash = document.getElementById("flash");
  if (!ex) return;
  if (!reps || reps < 1) { flash.style.color = "var(--danger)"; flash.textContent = "Please enter the reps."; return; }
  state.sets.push({ id: newId(), exId, exName: ex.name, split: { ...ex.split }, weight, reps, date: new Date().toISOString() });
  startRest(ex.rest || DEFAULT_REST);
  save();
  renderAll();
  flash.style.color = "";
  flash.textContent = `Saved: ${ex.name} ${fmt(weight)} × ${reps}`;
  setTimeout(() => { flash.textContent = ""; }, 2500);
});

document.getElementById("today-list").addEventListener("click", e => {
  const id = e.target.dataset.delSet;
  if (!id || !confirm("Delete this set?")) return;
  state.sets = state.sets.filter(s => s.id !== id);
  save();
  renderAll();
});

// ---- Settings ----
function renderTargets() {
  document.getElementById("targets").innerHTML = MUSCLES.map(m => `
    <div class="target-row">
      <span>${NICE[m]}</span>
      <input type="number" inputmode="decimal" min="0" step="0.5" value="${state.targets[m]}" data-target="${m}">
    </div>`).join("");
}

document.getElementById("targets").addEventListener("change", e => {
  const m = e.target.dataset.target;
  if (!m) return;
  state.targets[m] = Math.max(0, parseFloat(e.target.value) || 0);
  save();
  renderProgress();
});

function pctInputs(split, attr) {
  return MUSCLES.map(m => `
    <div>
      <label>${NICE[m]} %</label>
      <input type="number" inputmode="numeric" min="0" step="5" value="${Math.round((split[m] || 0) * 100)}" ${attr}="${m}">
    </div>`).join("");
}

function summaryText(split) {
  const parts = MUSCLES.filter(m => split[m]).map(m => `${NICE[m]} ${Math.round(split[m] * 100)}%`);
  return parts.length ? parts.join(", ") : "No muscles set";
}

function renderExerciseList() {
  const sorted = [...state.exercises].sort((a, b) => a.name.localeCompare(b.name));
  const open = new Set([...document.querySelectorAll("#exercise-list details[open]")].map(d => d.dataset.ex));
  document.getElementById("exercise-list").innerHTML = sorted.map(e => `
    <details data-ex="${e.id}" ${open.has(e.id) ? "open" : ""}>
      <summary>${escapeHtml(e.name)}<span>${summaryText(e.split)}</span></summary>
      <div class="pct-grid">${pctInputs(e.split, "data-pct")}</div>
      <div class="rest-row">
        <label>Rest between sets (seconds)</label>
        <input type="number" inputmode="numeric" min="0" step="15" value="${e.rest}" data-rest>
      </div>
      <button class="del" data-del-ex="${e.id}" style="margin-top:10px">Delete exercise</button>
    </details>`).join("");
}

document.getElementById("exercise-list").addEventListener("change", e => {
  if (e.target.hasAttribute("data-rest")) {
    findExercise(e.target.closest("details").dataset.ex).rest = Math.max(0, parseInt(e.target.value, 10) || 0);
    save();
    return;
  }
  const m = e.target.dataset.pct;
  if (!m) return;
  const ex = findExercise(e.target.closest("details").dataset.ex);
  const v = Math.max(0, parseFloat(e.target.value) || 0) / 100;
  if (v) ex.split[m] = v; else delete ex.split[m];
  save();
  // Only update the summary, so the box being typed in doesn't lose focus.
  e.target.closest("details").querySelector("summary span").textContent = summaryText(ex.split);
  renderProgress();
});

document.getElementById("exercise-list").addEventListener("click", e => {
  const id = e.target.dataset.delEx;
  if (!id) return;
  const ex = findExercise(id);
  if (!confirm(`Delete "${ex.name}"? Sets you already logged will still count.`)) return;
  state.exercises = state.exercises.filter(x => x.id !== id);
  save();
  renderAll();
});

document.getElementById("new-pcts").innerHTML = pctInputs({}, "data-new-pct");

document.getElementById("add-exercise").addEventListener("click", () => {
  const nameInput = document.getElementById("new-name");
  const name = nameInput.value.trim();
  if (!name) { alert("Please type a name for the exercise."); return; }
  const split = {};
  document.querySelectorAll("[data-new-pct]").forEach(inp => {
    const v = Math.max(0, parseFloat(inp.value) || 0) / 100;
    if (v) split[inp.dataset.newPct] = v;
  });
  if (!Object.keys(split).length) { alert("Please give at least one muscle a percentage, e.g. 100."); return; }
  const restInput = document.getElementById("new-rest");
  const rest = Math.max(0, parseInt(restInput.value, 10) || 0);
  state.exercises.push({ id: newId(), name, split, rest });
  save();
  nameInput.value = "";
  restInput.value = DEFAULT_REST;
  document.querySelectorAll("[data-new-pct]").forEach(inp => inp.value = 0);
  renderAll();
  alert(`"${name}" added.`);
});

// ---- Rest timer ----
// The finish time is saved, so the timer stays right even if the phone locks or the app is closed.
let timerTick = null;

function startRest(seconds) {
  state.restEnd = seconds > 0 ? Date.now() + seconds * 1000 : null;
  save();
  renderTimer();
}

function renderTimer() {
  clearInterval(timerTick);
  const box = document.getElementById("timer");
  if (!state.restEnd) { document.body.classList.remove("resting"); return; }
  document.body.classList.add("resting");
  const update = () => {
    const left = Math.ceil((state.restEnd - Date.now()) / 1000);
    const over = left <= 0;
    box.classList.toggle("over", over);
    document.getElementById("timer-text").firstChild.textContent = over ? "Rest over" : "Rest";
    const s = Math.max(0, left);
    document.getElementById("timer-time").textContent = over ? "Go!" : Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    document.getElementById("timer-close").textContent = over ? "OK" : "Skip";
    if (over) clearInterval(timerTick);
  };
  update();
  timerTick = setInterval(update, 250);
}

function adjustRest(seconds) {
  state.restEnd = Math.max(Date.now(), state.restEnd + seconds * 1000);
  save();
  renderTimer();
}

document.getElementById("timer-minus").addEventListener("click", () => adjustRest(-15));
document.getElementById("timer-plus").addEventListener("click", () => adjustRest(15));
document.getElementById("timer-close").addEventListener("click", () => startRest(0));

// ---- Tabs ----
const TITLES = { progress: "This week", log: "Log a set", settings: "Settings" };
document.querySelectorAll("nav button").forEach(btn => btn.addEventListener("click", () => {
  const tab = btn.dataset.tab;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b === btn));
  document.querySelectorAll("main section").forEach(s => s.classList.toggle("active", s.id === "tab-" + tab));
  document.getElementById("title").textContent = TITLES[tab];
  document.getElementById("week-label").style.display = tab === "progress" ? "" : "none";
  window.scrollTo(0, 0);
}));

function renderAll() {
  renderProgress();
  renderExerciseSelect();
  renderToday();
  renderTargets();
  renderExerciseList();
}

// Refresh when coming back to the app (e.g. a new week started while it was in the background).
document.addEventListener("visibilitychange", () => { if (!document.hidden) { renderProgress(); renderTimer(); } });

save();
renderAll();
renderTimer();
</script>
</body>
</html>
